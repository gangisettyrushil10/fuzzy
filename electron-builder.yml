appId: com.fuzzy.study
productName: fuzzy
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
win:
  executableName: fuzzy
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
afterPack: scripts/after-pack.mjs
mac:
  # Signed + notarized release builds: pnpm build:mac:release
  # Local unsigned DMG: pnpm build:mac
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  extendInfo:
    NSDocumentsFolderUsageDescription: Fuzzy imports PDFs you choose into your local library.
    NSDownloadsFolderUsageDescription: Fuzzy can import PDFs from your Downloads folder when you select them.
    NSAppleEventsUsageDescription: Fuzzy controls the Spotify app to play a soundtrack that matches the passage you are reading.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
mas:
  # Mac App Store build — uses "Apple Distribution" cert from Keychain.
  # Run: pnpm build:mas
  # Set MAS_PROVISIONING_PROFILE env var to the path of your downloaded .provisionprofile
  entitlements: build/entitlements.mas.plist
  entitlementsInherit: build/entitlements.mas.plist
  hardenedRuntime: false
  provisioningProfile: ${env.MAS_PROVISIONING_PROFILE}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: gangisettyrushil10
  repo: fuzzy
