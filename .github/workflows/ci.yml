name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: lint • typecheck • test • build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint --cache .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # `electron-vite build` runs typecheck again as part of `pnpm build`;
        # that's fine, it's fast and proves the build still composes.
        run: pnpm build
